name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            AnonymousPGC-Web/wallet/package-lock.json
            AnonymousPGC-Web/chain-monitor/package-lock.json
            AnonymousPGC-Web-Desktop/package-lock.json

      - name: Install shared React runtime
        run: npm ci

      - name: Build wallet
        working-directory: AnonymousPGC-Web/wallet
        env:
          VITE_PUBLIC_BASE: /APGC-Platform/wallet/
          VITE_APGC_API_URL: https://38.22.90.167
          VITE_APGC_API_TIMEOUT_MS: "120000"
        run: |
          npm ci
          npm run check

      - name: Build chain monitor
        working-directory: AnonymousPGC-Web/chain-monitor
        env:
          VITE_PUBLIC_BASE: /APGC-Platform/monitor/
          VITE_APGC_API_URL: https://38.22.90.167
          VITE_APGC_API_TIMEOUT_MS: "120000"
        run: |
          npm ci
          npm run check

      - name: Build desktop wallet
        working-directory: AnonymousPGC-Web-Desktop
        env:
          VITE_PUBLIC_BASE: /APGC-Platform/
          VITE_APGC_API_URL: https://38.22.90.167
          VITE_APGC_API_TIMEOUT_MS: "120000"
        run: |
          npm ci
          npm run check

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-output/wallet pages-output/monitor
          cp -a AnonymousPGC-Web-Desktop/dist/. pages-output/
          cp -a AnonymousPGC-Web/wallet/dist/. pages-output/wallet/
          cp -a AnonymousPGC-Web/chain-monitor/dist/. pages-output/monitor/
          touch pages-output/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
